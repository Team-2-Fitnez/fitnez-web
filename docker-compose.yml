services:
  app:
    build:
      dockerfile_inline: |
        FROM php:8.4-fpm
        RUN apt-get update && apt-get install -y git unzip zip libpq-dev libzip-dev libpng-dev libjpeg-dev libwebp-dev \
            && docker-php-ext-configure gd --with-jpeg --with-webp \
            && docker-php-ext-install pdo pdo_pgsql zip gd
        COPY --from=composer:2 /usr/bin/composer /usr/bin/composer
        WORKDIR /var/www/html
    container_name: fitnez-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - fitnez_storage:/var/www/html/storage
      - fitnez_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      - db
    networks:
      - fitnez-net
    command: >
      sh -c "
        mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public storage/app/private storage/app/private/trainer-applications storage/app/public/payment-proofs bootstrap/cache &&
        touch storage/logs/laravel.log &&
        chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true &&
        chmod -R a+rwX storage bootstrap/cache 2>/dev/null || true &&
        php-fpm
      "

  nginx:
    image: nginx:stable-alpine
    container_name: fitnez-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - fitnez_storage:/var/www/html/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fitnez-net

  frontend:
    image: node:22-alpine
    container_name: fitnez-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -lc "npm install && chmod -R a+x node_modules/.bin || true && npm run dev -- --host 0.0.0.0"
    networks:
      - fitnez-net

  socketio:
    image: node:22-alpine
    container_name: fitnez-socketio
    working_dir: /app
    volumes:
      - ./socketio:/app
    ports:
      - '6001:6001'
    networks:
      - fitnez-net
    environment:
      PORT: '6001'
      JWT_SECRET: 'fitnez-local-jwt-secret'
    command: sh -c "npm install && node server.js"

  db:
    image: postgres:16-alpine
    container_name: fitnez-db
    environment:
      POSTGRES_DB: fitnez
      POSTGRES_USER: fitnez
      POSTGRES_PASSWORD: fitnez_secret
    ports:
      - "5432:5432"
    volumes:
      - fitnez_pgdata:/var/lib/postgresql/data
    networks:
      - fitnez-net

volumes:
  fitnez_pgdata:
  fitnez_storage:
  fitnez_bootstrap_cache:

networks:
  fitnez-net:
    driver: bridge
