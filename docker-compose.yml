services:
  app:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: fitnez-app
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    volumes:
      - fitnez_storage:/var/www/html/storage
      - fitnez_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      - db
    networks:
      - fitnez-net
    command: >
      sh -c "
        mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public storage/app/private storage/app/private/trainer-applications storage/app/public/payment-proofs bootstrap/cache &&
        touch storage/logs/laravel.log &&
        chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true &&
        chmod -R a+rwX storage bootstrap/cache 2>/dev/null || true &&
        php-fpm
      "

  nginx:
    image: nginx:stable-alpine
    container_name: fitnez-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - fitnez_storage:/var/www/html/storage:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fitnez-net

  frontend:
    image: node:22-alpine
    container_name: fitnez-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -lc "if [ ! -d node_modules/.bin ]; then npm install --ignore-scripts; fi && chmod -R a+x node_modules/.bin || true && npm run dev -- --host 0.0.0.0"
    networks:
      - fitnez-net

  socketio:
    build:
      context: .
      dockerfile: infra/docker/socketio/Dockerfile
    container_name: fitnez-socketio
    working_dir: /app
    volumes:
      - ./socketio:/app
      - /app/node_modules
    ports:
      - '6001:6001'
    networks:
      - fitnez-net
    environment:
      PORT: '6001'
      JWT_SECRET: 'fitnez-local-jwt-secret'

  db:
    image: postgres:16-alpine
    container_name: fitnez-db
    environment:
      POSTGRES_DB: fitnez
      POSTGRES_USER: fitnez
      POSTGRES_PASSWORD: fitnez_secret
    ports:
      - "5432:5432"
    volumes:
      - fitnez_pgdata:/var/lib/postgresql/data
    networks:
      - fitnez-net

volumes:
  fitnez_pgdata:
  fitnez_storage:
  fitnez_bootstrap_cache:

networks:
  fitnez-net:
    driver: bridge
